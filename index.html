  <!-- ==========================================================
       動画セクション（月曜日のぽけぱれTV）
       APIは使わず、YouTubeの「埋め込みコード」を直接貼る方式です。
       動画が決まったら、対応する .video-slot を丸ごと下のように置き換えてください:

       <div class="video-frame">
         <iframe src="https://www.youtube.com/embed/動画ID" title="動画タイトル"
           loading="lazy" allowfullscreen
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
       </div>

       「動画ID」は、YouTubeの動画URL https://www.youtube.com/watch?v=XXXXXXXXXXX の
       "v=" のあとの11文字の部分です。
  ========================================================== -->
  <section id="show" class="video-section">
    <h2 class="section-title">月曜日のぽけぱれTV</h2>
    <div class="video-grid">
      <div class="video-slot" style="--slot-color:#FF5FA2;">動画準備中</div>
      <div class="video-slot" style="--slot-color:#9B5DE5;">動画準備中</div>
      <div class="video-slot" style="--slot-color:#00C2D1;">動画準備中</div>
    </div>
  </section>

  <!-- ==========================================================
       再生リストセクション
       こちらもAPI不要。再生リストが決まったら、.video-slot を下のように置き換えてください:

       <div class="video-frame">
         <iframe src="https://www.youtube.com/embed/videoseries?list=再生リストID" title="再生リスト名"
           loading="lazy" allowfullscreen
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
       </div>

       「再生リストID」は、再生リストのURL https://www.youtube.com/playlist?list=PLxxxxxxxx の
       "list=" のあとの文字列です。
  ========================================================== -->
  <section id="playlist" class="video-section">
    <h2 class="section-title">再生リスト</h2>
    <div class="video-grid">
      <div class="video-slot" style="--slot-color:#FFD23F;">準備中</div>
      <div class="video-slot" style="--slot-color:#00E0A4;">準備中</div>
      <div class="video-slot" style="--slot-color:#FF8A3D;">準備中</div>
    </div>
  </section>
